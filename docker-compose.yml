services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: sh -c "chown www-data:www-data /var/www/html/data && apache2-foreground"
    ports:
      - "8082:80"
    volumes:
      - .:/var/www/html
      # Volumen aislado: la base de prueba no toca data/ real.
      - panel_cindy_data:/var/www/html/data
volumes:
  panel_cindy_data:
